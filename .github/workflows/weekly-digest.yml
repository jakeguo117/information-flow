name: weekly-digest

on:
  workflow_dispatch:
    inputs:
      week:
        description: ISO week YYYY-Wnn (Asia/Shanghai)
        required: true
        type: string
      force:
        description: Overwrite an existing digest.md
        required: false
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout information-flow
        uses: actions/checkout@v4

      - name: Checkout DigitalBrain
        uses: actions/checkout@v4
        with:
          repository: jakeguo117/obsidian-digitalbrain
          token: ${{ secrets.DIGITALBRAIN_TOKEN }}
          path: digitalbrain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build weekly digest
        env:
          WEEK: ${{ inputs.week }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--vault digitalbrain --week "$WEEK")
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          python3 scripts/build_weekly_digest.py "${args[@]}"

      - name: Commit weekly digest
        working-directory: digitalbrain
        env:
          WEEK: ${{ inputs.week }}
        run: |
          git config user.name "information-flow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "📋 Digests/${WEEK}/digest.md"
          if git diff --cached --quiet; then
            echo "no weekly digest changes"
          else
            git commit -m "digest: week ${WEEK}"
            git push
          fi
