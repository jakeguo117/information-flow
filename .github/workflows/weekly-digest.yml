name: weekly-digest

# Thursday Asia/Hong_Kong (J03=A). One job; the cron hour or workflow_dispatch picks the stage.
#   08:00 process_batch.py    UTC cron 0 0 * * 4
#   20:00 build_digest_v2.py  UTC cron 0 12 * * 4
# workflow_dispatch inputs:
#   stage: process | digest
#   cycle_id: cy-YYYYMMDD for a Thursday in Asia/Hong_Kong. Any other value fails the job.
# A schedule run uses that Thursday's date in Asia/Hong_Kong. A start that is not Thursday there fails closed.
# A missing index directory, or a missing/empty inputs.jsonl, logs 索引未建，跳过 and skips setup, the scripts, and commit. The job stays green.

permissions:
  contents: read

concurrency:
  group: digitalbrain-digests
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 0 * * 4"
    - cron: "0 12 * * 4"
  workflow_dispatch:
    inputs:
      stage:
        description: "process = Thursday 08:00 HK process_batch.py; digest = Thursday 20:00 HK build_digest_v2.py"
        required: true
        type: choice
        options:
          - process
          - digest
      cycle_id:
        description: "Thursday cycle id cy-YYYYMMDD in Asia/Hong_Kong (example cy-20261022). Invalid, non-Thursday, or empty ids fail the job."
        required: true
        type: string

jobs:
  cycle:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Hong_Kong
    steps:
      - name: Checkout information-flow
        uses: actions/checkout@v4

      - name: Checkout DigitalBrain
        uses: actions/checkout@v4
        with:
          repository: jakeguo117/obsidian-digitalbrain
          token: ${{ secrets.DIGITALBRAIN_TOKEN }}
          path: digitalbrain

      - name: Check inbox index
        id: index
        run: |
          set -euo pipefail
          index="digitalbrain/📥 Inbox/_index"
          inputs="${index}/inputs.jsonl"
          if [ ! -d "$index" ] || [ ! -s "$inputs" ]; then
            echo "索引未建，跳过"
            echo "$index"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.index.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Resolve stage and cycle id
        if: steps.index.outputs.ready == 'true'
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_STAGE: ${{ inputs.stage }}
          INPUT_CYCLE_ID: ${{ inputs.cycle_id }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event = os.environ.get("EVENT_NAME", "")
          schedule = os.environ.get("EVENT_SCHEDULE", "")
          stage_in = os.environ.get("INPUT_STAGE", "")
          cycle_in = os.environ.get("INPUT_CYCLE_ID", "").strip()

          if event == "workflow_dispatch":
              stage = stage_in.strip()
          elif event == "schedule":
              if schedule == "0 0 * * 4":
                  stage = "process"
              elif schedule == "0 12 * * 4":
                  stage = "digest"
              else:
                  print(f"unexpected schedule: {schedule!r}", file=sys.stderr)
                  sys.exit(1)
          else:
              print(f"unexpected event: {event!r}", file=sys.stderr)
              sys.exit(1)

          if stage not in ("process", "digest"):
              print(f"invalid stage: {stage!r} (expected process or digest)", file=sys.stderr)
              sys.exit(1)
          print(f"stage={stage}", file=sys.stderr)

          if event == "schedule":
              now = datetime.now(ZoneInfo("Asia/Hong_Kong"))
              if now.weekday() != 3:
                  print(
                      f"schedule run is not Thursday in Asia/Hong_Kong: {now.isoformat()}",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              cycle_id = "cy-" + now.strftime("%Y%m%d")
          else:
              cycle_id = cycle_in

          if re.fullmatch(r"cy-[0-9]{8}", cycle_id) is None:
              print(f"invalid cycle id: {cycle_id!r} (expected cy-YYYYMMDD)", file=sys.stderr)
              sys.exit(1)
          try:
              day = datetime(int(cycle_id[3:7]), int(cycle_id[7:9]), int(cycle_id[9:11]))
          except ValueError:
              print(f"invalid cycle id date: {cycle_id}", file=sys.stderr)
              sys.exit(1)
          if day.weekday() != 3:
              print(f"cycle id must be a Thursday: {cycle_id}", file=sys.stderr)
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"stage={stage}\n")
              handle.write(f"cycle_id={cycle_id}\n")
          print(f"stage={stage} cycle_id={cycle_id}")
          PY

      - name: Run cycle stage
        if: steps.index.outputs.ready == 'true'
        env:
          STAGE: ${{ steps.resolve.outputs.stage }}
          CYCLE_ID: ${{ steps.resolve.outputs.cycle_id }}
        run: |
          set -euo pipefail
          case "$STAGE" in
            process|digest) ;;
            *)
              echo "invalid stage: ${STAGE}" >&2
              exit 1
              ;;
          esac
          case "$CYCLE_ID" in
            cy-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *)
              echo "invalid cycle id: ${CYCLE_ID}" >&2
              exit 1
              ;;
          esac
          index="digitalbrain/📥 Inbox/_index"
          if [ "$STAGE" = "process" ]; then
            python3 scripts/process_batch.py --vault digitalbrain --index "$index" --cycle-id "$CYCLE_ID"
          else
            python3 scripts/build_digest_v2.py --vault digitalbrain --index "$index" --cycle-id "$CYCLE_ID"
          fi

      - name: Commit cycle outputs
        if: steps.index.outputs.ready == 'true'
        working-directory: digitalbrain
        env:
          STAGE: ${{ steps.resolve.outputs.stage }}
          CYCLE_ID: ${{ steps.resolve.outputs.cycle_id }}
        run: |
          set -euo pipefail
          case "$STAGE" in
            process|digest) ;;
            *)
              echo "refusing commit for stage: ${STAGE}" >&2
              exit 1
              ;;
          esac
          case "$CYCLE_ID" in
            cy-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *)
              echo "refusing commit for cycle id: ${CYCLE_ID}" >&2
              exit 1
              ;;
          esac
          git config user.name "information-flow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cycle_dir="📋 Digests/cycles/${CYCLE_ID}"
          index_dir="📥 Inbox/_index"
          if [ ! -d "$cycle_dir" ]; then
            echo "missing ${cycle_dir}" >&2
            exit 1
          fi
          git add -- "$cycle_dir"
          if [ -d "$index_dir" ]; then
            git add -- "$index_dir"
          else
            echo "no ${index_dir}; committing cycle outputs only"
          fi
          CYCLE_DIR="$cycle_dir" INDEX_DIR="$index_dir" python3 -c '
          import os, sys
          cycle = os.environ["CYCLE_DIR"] + "/"
          index = os.environ["INDEX_DIR"] + "/"
          raw = sys.stdin.buffer.read().split(b"\0")
          for item in raw:
              if not item:
                  continue
              path = item.decode()
              if path.startswith(cycle) or path.startswith(index):
                  continue
              sys.stderr.write("refusing staged path outside cycle and index: " + path + "\n")
              sys.exit(1)
          ' < <(git diff --cached --name-only -z)
          if git diff --cached --quiet; then
            echo "no cycle changes"
          else
            git diff --cached --name-only
            git commit -m "cycle: ${CYCLE_ID} ${STAGE}"
            git push
          fi
