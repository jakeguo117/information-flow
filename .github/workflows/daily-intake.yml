name: daily-intake

permissions:
  contents: read
  actions: read

concurrency:
  group: digitalbrain-digests
  cancel-in-progress: false

on:
  schedule:
    - cron: "30 23 * * *" # 07:30 Asia/Hong_Kong
  workflow_dispatch:

jobs:
  intake:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Hong_Kong
    steps:
      - name: Checkout information-flow
        uses: actions/checkout@v4

      - name: Checkout DigitalBrain
        uses: actions/checkout@v4
        with:
          repository: jakeguo117/obsidian-digitalbrain
          token: ${{ secrets.DIGITALBRAIN_TOKEN }}
          path: digitalbrain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: pip install --quiet yt-dlp

      - name: Write YouTube secrets
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CLIENT: ${{ secrets.YOUTUBE_CLIENT }}
        run: |
          mkdir -p "$HOME/.secrets"
          printf '%s' "$YOUTUBE_TOKEN" > "$HOME/.secrets/youtube_token.json"
          printf '%s' "$YOUTUBE_CLIENT" > "$HOME/.secrets/google_client.json"
          chmod 600 "$HOME/.secrets/youtube_token.json" "$HOME/.secrets/google_client.json"

      - name: Resolve since date
        id: since
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=""
          if created="$(gh run list --workflow daily-intake.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt' 2>/tmp/since-err)"; then
            if [ -n "$created" ] && [ "$created" != "null" ]; then
              if hk="$(TZ=Asia/Hong_Kong date -d "$created" +%F 2>>/tmp/since-err)"; then
                since="$hk"
                echo "last successful daily-intake createdAt=$created Asia/Hong_Kong date=$since"
              fi
            else
              echo "no successful daily-intake run found"
            fi
          else
            echo "daily-intake success query failed"
            if [ -s /tmp/since-err ]; then
              cat /tmp/since-err
            fi
          fi
          if [ -z "$since" ]; then
            since="$(TZ=Asia/Hong_Kong date -d 'yesterday' +%F)"
            echo "since-date fallback: yesterday Asia/Hong_Kong = $since"
          fi
          echo "chosen since date: $since"
          echo "since=$since" >> "$GITHUB_OUTPUT"

      - name: Run YouTube likes
        env:
          YOUTUBE_TOKEN_FILE: ${{ env.HOME }}/.secrets/youtube_token.json
          YOUTUBE_CLIENT_FILE: ${{ env.HOME }}/.secrets/google_client.json
          SINCE: ${{ steps.since.outputs.since }}
        run: |
          export YOUTUBE_TOKEN_FILE="$HOME/.secrets/youtube_token.json"
          export YOUTUBE_CLIENT_FILE="$HOME/.secrets/google_client.json"
          python3 scripts/youtube_likes.py --vault digitalbrain --since "$SINCE"

      - name: Commit YouTube-Likes
        working-directory: digitalbrain
        run: |
          git config user.name "information-flow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d "📥 Inbox/YouTube-Likes" ]; then
            git add -- "📥 Inbox/YouTube-Likes"
          fi
          if git diff --cached --quiet; then
            echo "no YouTube-Likes changes"
          else
            git commit -m "intake: daily $(date +%F)"
            git push
          fi

      - name: Sync skills
        run: python3 scripts/sync_digitalbrain_skills.py --vault digitalbrain

      - name: Commit skill copies
        working-directory: digitalbrain
        run: |
          git config user.name "information-flow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r path; do
            git add -- "$path"
          done < <(python3 ../scripts/sync_digitalbrain_skills.py --vault . --print-paths)
          if git diff --cached --quiet; then
            echo "no skill copy changes"
          else
            git commit -m "sync: information-flow skills $(date +%F)"
            git push
          fi
